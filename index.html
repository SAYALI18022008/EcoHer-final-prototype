s" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1614772887723-f43f45d455e1?auto=format&fit=crop&w=1200&q=85'"><figcaption><span class="gallery-eyebrow">Small batches</span>Thoughtful from the start.</figcaption></figure><figure><img src="https://images.unsplash.com/photo-1614772887723-f43f45d455e1?auto=format&fit=crop&w=1200&q=85" alt="Indian woman entrepreneur working at a sewing machine" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1614772887723-f43f45d455e1?auto=format&fit=crop&w=1200&q=85'"><figcaption><span class="gallery-eyebrow">Local makers</span>Growing, together.</figcaption></figure></div></div></section><section class="promise"><div class="promise-in"><div><div class="eyebrow" style="color:#cfbd86">Trust is built with clarity</div><h2 class="serif">No vague green claims.</h2><p>Verification tells you what has actually been checked: founder information, product details, material information, and whether a partner review is still pending.</p></div><div class="panel" style="background:#ffffff10;border-color:#ffffff30;color:#fff"><span class="badge">Community Verified</span><h3 style="color:white;margin-top:15px">Asha Upcycles</h3><div class="tableline"><span>Founder identity submitted</span><b>✓</b></div><div class="tableline"><span>Product information reviewed</span><b>✓</b></div><div class="tableline"><span>Materials information provided</span><b>✓</b></div><div class="tableline"><span>Partner verification</span><b>○ Pending</b></div><button class="btn" style="margin-top:16px;background:#f3eddf;color:var(--forest)" onclick="openBusiness('asha')">View full business profile →</button></div></div></section></main>${footer()}`}

'My Skills':`<div class="panel"><h3>Your mentor profile</h3><p class="muted">Help entrepreneurs find you by the skills and experience you bring.</p><div class="form-control"><label>Skills</label><input id="mentorSkills" value="${esc(state.user?.mentor?.skills?.join(', ')||'Branding, Instagram Marketing, Product Photography')}"></div><div class="form-control"><label>Languages</label><input id="mentorLanguages" value="${esc(state.user?.mentor?.languages?.join(', ')||'Hindi, English')}"></div><div class="form-control"><label>Availability</label><select id="mentorAvailability"><option>This week</option><option>4 hours / month</option><option>8 hours / month</option></select></div><button class="btn" onclick="saveMentorProfile()">Save profile</button></div>`};main.innerHTML=panels[page]||`<div class="panel"><h3>${page}</h3><p class="muted">Your ${page.toLowerCase()} workspace.</p></div>`;if(page==='Impact Passport'&&!cloudReady&&state.ownImpact?.length){const details=main.querySelector('details');details?.insertAdjacentHTML('beforebegin',`<div class="impact-grid">${state.ownImpact.map(x=>`<div class="impact-box"><strong>${esc(x.value)} ${esc(x.unit)}</strong><small>${esc(x.metric_label)} · Estimated</small></div>`).join('')}</div>`)}}

function login(){return `${nav()}<main class="auth-wrap"><div class="auth-image" role="img" aria-label="Indian woman artisan weaving fabric at her loom"><div><div class="eyebrow" style="color:#e4d39f">A community for the work you do</div><h2 class="serif">Your next step deserves good company.</h2></div></div><div class="auth-form"><div class="auth-card"><div class="brand"><span class="brandmark">e</span> ecoher</div><h1>Welcome back</h1><p>Pick up where your business journey left off.</p><form onsubmit="doLogin(event)"><div class="form-control"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="form-control"><label for="password">Password</label><input id="password" type="password" required placeholder="Your password"></div><div style="display:flex;justify-content:space-between;font-size:11px"><label><input type="checkbox"> Remember me</label><button type="button" class="textbtn" onclick="passwordReset()">Forgot password?</button></div><button class="btn" style="width:100%;margin-top:18px">Log in</button></form><div class="panel" style="margin-top:15px;padding:14px;text-align:center"><div class="eyebrow">Explore the product</div><p class="muted" style="font-size:11px;margin:8px 0">No account needed. Demo changes save in this browser.</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="btn small" data-role="Entrepreneur" onclick="enterDemo(this.dataset.role)">Entrepreneur demo</button><button class="btn outline small" data-role="Customer" onclick="enterDemo(this.dataset.role)">Customer demo</button><button class="btn outline small" data-role="Mentor" onclick="enterDemo(this.dataset.role)">Mentor demo</button></div></div><p style="text-align:center;margin-top:20px">Don’t have an account? <button class="textbtn" onclick="go('signup')">Create one</button></p></div></div></main>`}
function signup(){return `${nav()}<main class="auth-wrap"><div class="auth-image" role="img" aria-label="Indian woman artisan weaving fabric at her loom" style="background-image:linear-gradient(0deg,#163b31b0,transparent 70%),url('https://images.unsplash.com/photo-1614772887723-f43f45d455e1?auto=format&fit=crop&w=1200&q=85')"><div><div class="eyebrow" style="color:#e4d39f">Your work has a place here</div><h2 class="serif">Make the good you do easier to find.</h2></div></div><div class="auth-form"><div class="auth-card"><div class="brand"><span class="brandmark">e</span> ecoher</div><div class="eyebrow" style="margin-top:24px">Create your account</div><div class="onboard-progress"><i class="on" id="p1"></i><i id="p2"></i><i id="p3"></i></div><div id="signupStep"><h1>First, a little about you.</h1><p>Start with the basics. You can add more as you go.</p><form onsubmit="signupNext(event)"><div class="form-control"><label>Full name</label><input name="name" required placeholder="Your name"></div><div class="form-control"><label>Email address</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="form-control"><label>Password</label><input id="newPass" name="password" type="password" minlength="8" required placeholder="At least 8 characters" oninput="passwordMeter()"><small id="pwHint" class="muted">Use at least 8 characters.</small></div><div class="form-control"><label>Confirm password</label><input name="confirm" type="password" minlength="8" required placeholder="Enter your password again"></div><div class="form-control"><label>Location</label><select name="city" required><option value="">Choose your city</option>${['Pune','Mumbai','Bengaluru','Delhi','Jaipur','Ahmedabad'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-control"><label>I’m joining as</label><select name="role" id="rolePick" onchange="toggleBusiness()"><option>Entrepreneur</option><option>Customer</option><option>Mentor</option></select></div><div id="businessFields"><div class="form-control"><label>Business name</label><input name="business" placeholder="What do you call your business?"></div><div class="simple-grid"><div class="form-control"><label>Business category</label><select name="category"><option>Upcycled</option><option>Handmade</option><option>Organic</option><option>Eco-packaging</option></select></div><div class="form-control"><label>Sustainability focus</label><select name="sustainability"><option>Textile reuse</option><option>Natural materials</option><option>Plastic-free</option></select></div></div></div><button class="btn" style="width:100%;margin-top:7px">Create my account →</button></form><p style="text-align:center">Already have an account? <button class="textbtn" onclick="go('login')">Log in</button></p></div></div></div></main>`}
function toggleBusiness(){const el=document.getElementById('businessFields');if(el)el.classList.toggle('hide',document.getElementById('rolePick').value!=='Entrepreneur')}
function passwordMeter(){let v=document.getElementById('newPass').value,h=document.getElementById('pwHint');if(h){h.textContent=v.length>=12?'Strong password':v.length>=8?'Good start — longer is stronger':'Use at least 8 characters.';h.style.color=v.length>=12?'#4e754d':'#73776e'}}
async function passwordDigest(value){if(globalThis.crypto?.subtle){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('')}return 'local:'+value}
async function signupNext(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||''),role=f.get('role');if(password!==f.get('confirm')){toast('Your passwords don’t match yet.');return}if(password.length<8){toast('Choose a password with at least 8 characters.');return}try{const accounts=read('accounts',[]);if(accounts.some(a=>a.email===email)){toast('An account with this email already exists. Log in instead.');return}const user={name:String(f.get('name')).trim(),email,role,city:f.get('city')};if(role==='Entrepreneur'){user.business=String(f.get('business')||user.name+' Studio').trim();user.businessId='local-'+Date.now();user.businessRecord={name:user.business,city:user.city,category:f.get('category'),tagline:'',description:''}}if(role==='Mentor')user.mentor={skills:[],languages:[],availability:'Available this week'};accounts.push({email,passwordHash:await passwordDigest(password),user});write('accounts',accounts);state.user=user;state.saved=read('saved',[]);state.requests=read('requests',[]);state.products=read('products',[]);state.ownImpact=read('impact',[]);write('user',user);toast('Account created. You can log in with this email and password anytime.');go('dashboard')}catch(error){toast(error.message||'Could not save your account in this browser.')}}
async function doLogin(e){e.preventDefault();const email=String(document.getElementById('email').value||'').trim().toLowerCase(),password=document.getElementById('password').value;try{const accounts=read('accounts',[]),account=accounts.find(a=>a.email===email);if(!account){toast('No account found for this email. Create an account first.');return}if(account.passwordHash!==await passwordDigest(password)){toast('That password doesn’t match this account. Try again.');return}state.user=account.user;state.saved=read('saved',[]);state.requests=read('requests',[]);state.products=read('products',[]);state.ownImpact=read('impact',[]);state.mentorRequests=read('mentorRequests',[]);write('user',state.user);toast('Welcome back, '+state.user.name.split(' ')[0]+'.');go('dashboard')}catch(error){toast(error.message||'Could not log in.')}}
async function logout(){if(cloudReady){const {error}=await supabase.auth.signOut();if(error){toast(error.message);return}}state.user=null;state.saved=[];state.requests=[];write('user',null);go('home');toast('You’ve been logged out.')}
function enterDemo(role='Entrepreneur'){cloudReady=false;const presets={Entrepreneur:{name:'Asha Kulkarni',email:'asha@ecoher.demo',role,city:'Pune',business:'Asha Upcycles',businessId:'demo-asha',businessRecord:{name:'Asha Upcycles',city:'Pune',state:'Maharashtra',category:'Upcycled',tagline:'Giving discarded sarees a second life.',description:'Turning treasured textiles into everyday bags with local makers.'}},Customer:{name:'Priya Shah',email:'priya@ecoher.demo',role,city:'Mumbai'},Mentor:{name:'Meena Sharma',email:'meena@ecoher.demo',role,city:'Jaipur',mentor:{skills:['Branding','Instagram Marketing'],languages:['Hindi','English'],availability:'Available this week'}}};state.user=presets[role]||presets.Entrepreneur;state.saved=read('saved',[]);state.requests=read('requests',[]);state.products=read('products',[]);state.ownImpact=read('impact',[]);state.mentorRequests=read('mentorRequests',[]);write('user',state.user);toast('Demo workspace ready. Changes save on this device.');go('dashboard')}function go(r){location.hash=r;state.route=r;render();window.scrollTo(0,0)}
function render(){state.route=location.hash.slice(1)||'home';let page=state.route==='discover'?discover():state.route==='dashboard'?dashboard():state.route==='login'?login():state.route==='signup'?signup():state.route==='reset-password'?passwordChangePage():state.route==='mentorship'?mentorshipPage():state.route==='impact'?impactPage():home();root.innerHTML=`<div class="backend-notice">Local mode · Accounts and changes save in this browser.</div>`+page}

function applyFilters(){const q=(document.getElementById('searchInput')?.value||'').toLowerCase(),loc=document.getElementById('locFilter')?.value||'',cat=document.getElementById('catFilter')?.value||'',type=document.getElementById('typeFilter')?.value||'',ver=document.getElementById('verFilter')?.value||'';let list=businesses.filter(b=>(!q||Object.values(b).join(' ').toLowerCase().includes(q))&&(!loc||b.city===loc)&&(!cat||b.category===cat)&&(!type||b.type===type)&&(!ver||b.verify===ver));document.getElementById('businessResults').innerHTML=list.length?list.map(businessCard).join(''):`<div class="panel" style="grid-column:1/-1;text-align:center;padding:42px"><h3>No businesses match those filters yet.</h3><p class="muted">Try a different search or clear one of your filters.</p><button class="btn outline" onclick="document.querySelectorAll('.filters select').forEach(x=>x.value='');document.getElementById('searchInput').value='';applyFilters()">Clear filters</button></div>`}
async function toggleSave(id){if(!state.user){toast('Log in to save a business.');return}let wasSaved=state.saved.includes(id);try{if(supabaseConfigured)await toggleSavedBusiness(state.user.id,id,wasSaved);state.saved=wasSaved?state.saved.filter(x=>x!==id):[...state.saved,id];write('saved',state.saved);if(state.route==='discover')applyFilters();else if(state.route==='dashboard')dashPage(state.user.role==='Customer'?'Saved Businesses':'Dashboard');toast(wasSaved?'Business removed from saved.':'Business saved to your list.')}catch(error){toast(error.message||'Could not update saved businesses.')}}
function openBusinessDemo(id){let b=businesses.find(x=>x.id===id);let impact=b.metrics||[['Textile waste reused','18 kg'],['Reusable packaging','42 units'],['Women supported','3'],['Local suppliers','5']];let overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.innerHTML=`<article class="modal"><button class="close" onclick="document.getElementById('modal').remove()" aria-label="Close">×</button><div class="profile-hero" style="background-image:linear-gradient(0deg,#122c2370,transparent 70%),url('${b.img}')"></div><span class="badge ${b.verify==='Partner Verified'?'gold':''}">${b.verify}</span><h2 class="serif" style="font-size:34px;color:var(--forest);margin:11px 0 4px">${b.name}</h2><div class="muted">Founded by ${b.founder} · ${b.city}, ${b.state} · ${b.category}</div><p style="font-family:'Playfair Display';font-size:19px;color:#4d5a50">“${b.statement}”</p><div class="eyebrow">The founder story</div><p class="muted" style="line-height:1.7">${b.story||b.statement+' Built with local makers, thoughtful materials and a belief that small businesses can make a lasting difference.'}</p><div class="simple-grid"><div><div class="eyebrow">Materials</div><p class="muted" style="font-size:11px">${b.materials||b.type+' and locally sourced materials'}</p></div><div><div class="eyebrow">How it’s made</div><p class="muted" style="font-size:11px">${b.method||'Small-batch production with local partners.'}</p></div></div><div class="eyebrow" style="margin-top:16px">Products</div><div class="product-row">${(b.products||['Reusable Jute Gift Box · ₹299','Organic Soy Candle · ₹499','Handmade Bamboo Organizer · ₹649']).map(x=>`<div class="product">${x}</div>`).join('')}</div><div class="panel" style="margin-top:17px;padding:15px"><div class="panel-head"><div><div class="eyebrow">Transparent, entrepreneur-reported metrics</div><h3 style="margin:4px 0">Impact Passport</h3></div><span class="badge gold">Estimated impact</span></div><div class="impact-grid">${impact.map(x=>`<div class="impact-box"><strong>${x[1]}</strong><small>${x[0]}</small></div>`).join('')}</div><details style="margin-top:14px"><summary style="cursor:pointer;font-size:11px;color:var(--forest)">How is this calculated?</summary><p class="muted" style="font-size:11px">Estimated textile reuse: 36 products × 0.5 kg textile per product = 18 kg. This is an estimate based on information provided by the entrepreneur and has not been independently verified.</p></details></div><div class="panel" style="margin-top:14px"><div class="eyebrow">What has been checked</div><h3 style="margin:7px 0">${b.verify}</h3><div class="tableline"><span>Founder identity submitted</span><b>✓</b></div><div class="tableline"><span>Product information reviewed</span><b>✓</b></div><div class="tableline"><span>Materials information provided</span><b>✓</b></div><div class="tableline"><span>Partner verification</span><b>○ Pending</b></div></div><div style="display:flex;gap:9px;margin-top:17px"><button class="btn" onclick="contactBusiness('${b.name}')">Contact entrepreneur</button><button class="btn outline" onclick="requestProduct('${b.name}')">Request a product</button><button class="textbtn" onclick="toggleSave('${b.id}')">${state.saved.includes(b.id)?'♥ Saved':'♡ Save'}</button></div></article>`;document.body.appendChild(overlay)}

async function openBusiness(id){let b=businesses.find(x=>x.id===id);if(!b)return;let evidence={impact:[],verification:[]};if(cloudReady){try{evidence=await loadBusinessEvidence(id)}catch(error){toast(error.message||'Could not load business evidence.')}}let impactRows=cloudReady?evidence.impact.map(x=>[`${x.value} ${x.unit}`,`${x.metric_label} · ${x.is_estimated?'Estimated':'Reviewed'}`]):(b.metrics||[['Textile waste reused','18 kg'],['Reusable packaging','42 units'],['Women supported','3'],['Local suppliers','5']]);let checks=cloudReady?(evidence.verification.length?evidence.verification.map(x=>`<div class="tableline"><span>${esc(x.check_type)}${x.notes?' · '+esc(x.notes):''}</span><b>${esc(x.status)}</b></div>`).join(''):'<p class="muted">No verification evidence has been submitted yet.</p>'):'<div class="tableline"><span>Founder identity submitted</span><b>✓</b></div><div class="tableline"><span>Product information reviewed</span><b>✓</b></div><div class="tableline"><span>Materials information provided</span><b>✓</b></div><div class="tableline"><span>Partner verification</span><b>○ Pending</b></div>';let products=b.products||[];let overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.innerHTML=`<article class="modal"><button class="close" onclick="document.getElementById('modal').remove()" aria-label="Close">×</button><div class="profile-hero" style="background-image:linear-gradient(0deg,#122c2370,transparent 70%),url('${esc(b.img)}')"></div><span class="badge">${esc(b.verify)}</span><h2 class="serif" style="font-size:34px;color:var(--forest);margin:11px 0 4px">${esc(b.name)}</h2><div class="muted">Founded by ${esc(b.founder)} · ${esc(b.city)}, ${esc(b.state)} · ${esc(b.category)}</div><p style="font-family:'Playfair Display';font-size:19px;color:#4d5a50">“${esc(b.statement)}”</p><div class="eyebrow">The founder story</div><p class="muted" style="line-height:1.7">${esc(b.story||b.statement||'')}</p><div class="simple-grid"><div><div class="eyebrow">Materials</div><p class="muted" style="font-size:11px">${esc(b.materials||'Not provided')}</p></div><div><div class="eyebrow">How it’s made</div><p class="muted" style="font-size:11px">${esc(b.method||'Not provided')}</p></div></div><div class="eyebrow" style="margin-top:16px">Products</div><div class="product-row">${products.length?products.map(x=>`<div class="product">${esc(x)}</div>`).join(''):'<p class="muted">No products published yet.</p>'}</div><div class="panel" style="margin-top:17px;padding:15px"><div class="panel-head"><div><div class="eyebrow">Entrepreneur-reported metrics</div><h3 style="margin:4px 0">Impact Passport</h3></div><span class="badge gold">Estimated impact</span></div><div class="impact-grid">${impactRows.length?impactRows.map(x=>`<div class="impact-box"><strong>${esc(x[1])}</strong><small>${esc(x[0])}</small></div>`).join(''):'<p class="muted">No impact information submitted yet.</p>'}</div><details style="margin-top:14px"><summary style="cursor:pointer;font-size:11px;color:var(--forest)">How is this calculated?</summary><p class="muted" style="font-size:11px">Impact records are labeled estimated and include their calculation method when provided. They are not independently verified.</p></details></div><div class="panel" style="margin-top:14px"><div class="eyebrow">What has been checked</div><h3 style="margin:7px 0">${esc(b.verify)}</h3>${checks}</div><div style="display:flex;gap:9px;margin-top:17px"><button class="btn" onclick="contactBusiness('${esc(b.name)}')">Contact entrepreneur</button><button class="btn outline" onclick="requestProduct('${esc(b.name)}')">Request a product</button><button class="textbtn" onclick="toggleSave('${b.id}')">${state.saved.includes(b.id)?'♥ Saved':'♡ Save'}</button></div></article>`;document.body.appendChild(overlay)}
async function contactBusiness(name){if(!state.user){toast('Create an account to contact this entrepreneur.');return}try{if(cloudReady){const b=businesses.find(x=>x.name===name);if(!b)throw Error('Business profile not found.');await createBusinessContact({requesterId:state.user.id,businessId:b.id,kind:'contact',message:'I would like to learn more about your business.'})}else{state.requests.push('Contact request · '+name);write('requests',state.requests)}toast('Your contact request was sent to '+name+'.')}catch(error){toast(error.message||'Could not send the request.')}}
async function requestProduct(name){if(!state.user){toast('Create an account to request a product.');return}try{if(cloudReady){const b=businesses.find(x=>x.name===name);if(!b)throw Error('Business profile not found.');await createBusinessContact({requesterId:state.user.id,businessId:b.id,kind:'product_request',message:'I would like to ask about products and availability.'})}else{state.requests.push('Product request · '+name);write('requests',state.requests)}toast('Product request sent. The entrepreneur can follow up with you.')}catch(error){toast(error.message||'Could not send the request.')}}
async function requestMentor(name='Meena Crafts'){if(!state.user){toast('Create an entrepreneur account to request a mentor.');return}try{if(cloudReady){if(state.user.role!=='Entrepreneur')throw Error('Mentorship requests are available to entrepreneur accounts.');const mentor=mentors.find(x=>x.name===name);if(!mentor?.id)throw Error('This mentor profile is not yet available in Supabase.');await createMentorshipRequest({entrepreneurId:state.user.id,mentorId:mentor.id,businessId:state.user.businessId,goal:'Product Photography'})}else{state.requests.push(name);write('requests',state.requests)}toast('Mentorship request sent to '+name+'.')}catch(error){toast(error.message||'Could not send the mentorship request.')}}
async function acceptRequest(id){try{const requests=read('mentorRequests',state.mentorRequests||[]),request=requests.find(x=>String(x.id)===String(id));if(request)request.status='accepted';state.mentorRequests=requests;write('mentorRequests',requests);dashPage('Overview');toast('Request accepted. A structured guidance plan is ready.')}catch(error){toast(error.message||'Could not update the mentorship request.')}}
async function addProduct(){let name=prompt('Product name?');if(!name)return;let price=prompt('Price in INR (e.g. 599)?','599');try{if(cloudReady){let businessId=state.user?.businessId;if(!businessId){let b=await loadMyBusiness(state.user.id);businessId=b?.id;state.user.businessId=businessId}if(!businessId)throw Error('Create your business profile before adding products.');await addSupabaseProduct(businessId,{name,price:Number(String(price||'0').replace(/[^0-9.]/g,''))||0,currency:'INR'});state.products=await loadProducts(businessId)}else{state.products.push(name+' · '+(price||'Price on request'));write('products',state.products)}dashPage('Products');toast('Product added to your catalogue.')}catch(error){toast(error.message||'Could not add the product.')}}
async function saveBusinessProfile(){try{let fields=[...document.querySelectorAll('#dashContent input,#dashContent select')],values=Object.fromEntries(fields.map(el=>[el.previousElementSibling?.textContent?.trim(),el.value]));const patch={name:values['Business name']||state.user.business,city:(values.Location||state.user.city||'Pune').split(',')[0].trim(),state:(values.Location||'').split(',').slice(1).join(',').trim(),category:values.Category||'Upcycled',tagline:values['Business tagline']||'',description:values['Founder story']||''};if(cloudReady){await updateBusiness(state.user.businessId,patch)}state.user.business=patch.name;state.user.businessRecord={...state.user.businessRecord,...patch};write('user',state.user);toast('Business profile saved.')}catch(error){toast(error.message||'Could not save the business profile.')}}
async function submitVerificationRequest(){if(!state.user){toast('Log in as the business owner to submit verification information.');return}try{let notes=prompt('What evidence are you submitting? Add a short description.','Materials information and product photos');if(notes===null)return;if(cloudReady){if(!state.user.businessId)throw Error('Create your business profile first.');await submitVerification({businessId:state.user.businessId,userId:state.user.id,checkType:'Materials information',notes})}else{state.verification=read('verification',[]);state.verification.push({check_type:'Materials information',notes,status:'pending'});write('verification',state.verification)}toast('Evidence submitted for review.')}catch(error){toast(error.message||'Could not submit verification evidence.')}}
async function addImpactUpdate(){try{if(!state.user?.businessId)throw Error('Create your business profile first.');const label=prompt('Impact metric (e.g. Textile waste reused)');if(!label)return;const value=Number(prompt('Quantity (numbers only)'));if(!Number.isFinite(value)||value<0)throw Error('Enter a valid non-negative quantity.');const unit=prompt('Unit (e.g. kg, units, people)','kg');if(!unit)return;const method=prompt('How did you calculate or estimate this number?');if(!method)return;if(cloudReady){await addImpactRecord({businessId:state.user.businessId,userId:state.user.id,metricLabel:label,value,unit,method});const records=await loadBusinessEvidence(state.user.businessId);state.ownImpact=records.impact}else{state.ownImpact=read('impact',[]);state.ownImpact.push({metric_label:label,value,unit,is_estimated:true,calculation_method:method});write('impact',state.ownImpact)}dashPage('Impact Passport');toast('Impact update saved as estimated.')}catch(error){toast(error.message||'Could not save the impact update.')}}
async function saveMentorProfile(){try{const patch={skills:document.getElementById('mentorSkills').value.split(',').map(x=>x.trim()).filter(Boolean),languages:document.getElementById('mentorLanguages').value.split(',').map(x=>x.trim()).filter(Boolean),availability:document.getElementById('mentorAvailability').value};if(supabaseConfigured)await updateMentorProfile(state.user.id,patch);state.user.mentor={...state.user.mentor,...patch};write('user',state.user);toast('Mentor profile updated.')}catch(error){toast(error.message||'Could not save the mentor profile.')}}
async function bootstrapSupabase(){if(!supabaseConfigured){cloudReady=false;render();return}try{const {data,error}=await supabase.auth.getSession();if(error)throw error;const [remoteBusinesses,remoteMentors]=await Promise.all([loadBusinesses(),loadMentors()]);if(remoteBusinesses.length)businesses.splice(0,businesses.length,...remoteBusinesses);if(remoteMentors.length)mentors.splice(0,mentors.length,...remoteMentors);cloudReady=true;if(data.session){state.user=await loadProfile(data.session.user.id);state.saved=await loadSavedBusinessIds(state.user.id);state.mentorRequests=await loadMentorshipRequests(state.user.id,state.user.role);if(state.user.businessId){const rows=await loadProducts(state.user.businessId);state.products=rows.map(x=>`${x.name} · ₹${Number(x.price).toLocaleString('en-IN')}`);const evidence=await loadBusinessEvidence(state.user.businessId);state.ownImpact=evidence.impact;state.businessContacts=await loadBusinessContacts(state.user.businessId)}if(state.user.role==='Customer'){const contacts=await loadMyBusinessContacts(state.user.id);state.requests=contacts.map(x=>`${x.kind==='product_request'?'Product request':'Contact request'} · ${x.business?.name||'Business'} · ${x.status}`)}}render()}catch(error){cloudReady=false;state.user=read('user',null);state.saved=read('saved',[]);state.requests=read('requests',[]);state.products=read('products',[]);state.ownImpact=read('impact',[]);toast('Cloud setup is unavailable. Local demo mode is ready; changes save on this device.');render()}}
async function passwordReset(){const email=String(document.getElementById('email')?.value||'').trim().toLowerCase();if(!email){toast('Enter your account email first.');return}const accounts=read('accounts',[]),account=accounts.find(a=>a.email===email);if(!account){toast('No local account found for this email.');return}const password=prompt('Choose a new password (at least 8 characters):');if(password===null)return;if(password.length<8){toast('Choose a password with at least 8 characters.');return}account.passwordHash=await passwordDigest(password);write('accounts',accounts);toast('Password changed. Log in with your new password.')}

Object.assign(window,{enterDemo,go,logout,toggleSave,openBusiness,contactBusiness,requestProduct,requestMentor,acceptRequest,addProduct,saveBusinessProfile,submitVerificationRequest,addImpactUpdate,saveMentorProfile,dashPage,applyFilters,filterMentors,doLogin,signupNext,toggleBusiness,passwordMeter,passwordReset,loginWithGoogle,updatePassword,toast});

function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
